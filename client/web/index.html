  <!-- Track RTCPeerConnections created by Agora so the canvas compositor can
       replace the video sender track.  Must run before iris-web-rtc.js.
       Uses a Proxy construct trap so static properties, instanceof checks,
       and any properties added to RTCPeerConnection later all work correctly. -->
  <script>
    (function () {
      window._franklyPeerConnections = new Set();
      var _Orig = window.RTCPeerConnection;
      window.RTCPeerConnection = new Proxy(_Orig, {
        construct: function (target, args, newTarget) {
          var pc = Reflect.construct(target, args, newTarget);
          window._franklyPeerConnections.add(pc);
          pc.addEventListener('connectionstatechange', function () {
            var s = pc.connectionState;
            if (s === 'closed' || s === 'failed') window._franklyPeerConnections.delete(pc);
          });
          return pc;
        }
      });
    })();
  </script>

  <!-- iris-web-rtc must execute before flutter_bootstrap to ensure Agora globals are available -->

  <!-- Client bridge: subscriber-side quality APIs iris-web stubs out

  <script src="./agora/agora_client_bridge.js" defer></script>
