name: Firebase Test
on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            functions:
              - 'firebase/functions/**'
              - 'matching/lib/**'
            firestore:
              - 'firebase/firestore/**'

      - name: Setup Node
        if: steps.changes.outputs.functions == 'true' || steps.changes.outputs.firestore == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: ./firebase/functions/package-lock.json
          cache: "npm"

      - name: Install Functions NPM Dependencies
        if: steps.changes.outputs.functions == 'true'
        run: npm ci

      - name: Install Firestore NPM Dependencies
        if: steps.changes.outputs.firestore == 'true'
        run: npm ci
        working-directory: "firebase/firestore"

      - name: Set Up Flutter
        if: steps.changes.outputs.functions == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4" # Pin stable toolchain (see client/UPGRADE-README.md)
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-path: "/home/runner/.pub-cache" #hardcoded not ideal, but no way to reference $HOME

      # Incomplete tool-cache restores can omit Dart SDK pieces; build_runner then fails looking for
      # frontend_server*.snapshot. Current Dart SDKs ship frontend_server_aot.dart.snapshot (JIT path optional).
      # Do not use `flutter --version` here: after removing dart-sdk the flutter wrapper has no dart binary.
      - name: Repair incomplete Flutter/Dart SDK in tool cache
        if: steps.changes.outputs.functions == 'true'
        run: |
          SDK_BIN="$FLUTTER_ROOT/bin/cache/dart-sdk/bin"
          SNAP_JIT="$SDK_BIN/snapshots/frontend_server.dart.snapshot"
          SNAP_AOT="$SDK_BIN/snapshots/frontend_server_aot.dart.snapshot"
          dart_sdk_complete() {
            [ -x "$SDK_BIN/dart" ] && { [ -f "$SNAP_JIT" ] || [ -f "$SNAP_AOT" ]; }
          }
          if ! dart_sdk_complete; then
            echo "::warning::Flutter tool cache missing Dart SDK or frontend_server snapshot; re-downloading Dart SDK"
            rm -rf "$FLUTTER_ROOT/bin/cache/dart-sdk"
            rm -f "$FLUTTER_ROOT/bin/cache/engine-dart-sdk.stamp"
            bash "$FLUTTER_ROOT/bin/internal/update_dart_sdk.sh"
          fi
          dart_sdk_complete || { echo "::error::Dart SDK still incomplete after repair"; exit 1; }

      - name: Install Dart Dependencies
        if: steps.changes.outputs.functions == 'true'
        run: flutter pub get

      - name: Build Functions
        if: steps.changes.outputs.functions == 'true'
        run: dart run build_runner build --output=build

      - name: Cache Firebase Emulators
        if: steps.changes.outputs.firestore == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Set up Java 21
        if: steps.changes.outputs.firestore == 'true' || steps.changes.outputs.functions == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase Tools
        if: steps.changes.outputs.firestore == 'true' || steps.changes.outputs.functions == 'true'
        run: npm install -g firebase-tools

      - name: Test Rules
        if: steps.changes.outputs.firestore == 'true'
        run: firebase emulators:exec --only firestore --project fake-project-id 'npm run test'
        working-directory: "firebase/firestore"

      - name: Test Functions
        if: steps.changes.outputs.functions == 'true'
        run: CLOUD_RUNTIME_CONFIG=./test/test_config.json firebase emulators:exec --only firestore --project fake-project-id 'npm run test'
