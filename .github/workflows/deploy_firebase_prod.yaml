name: Deploy Firebase Components to Production
concurrency: production
on:
  push:
    branches:
      - main
    paths:
      - 'firebase/functions/js/**'
      - 'firebase/functions/lib/**'
      - 'firebase/functions/index.js'
      - 'firebase/functions/package.json'
      - 'firebase/firestore/**'
      - 'data_models/lib/**'
      - 'matching/lib/**'
  workflow_dispatch:

jobs:
  deploy_firebase_prod:
    name: Deploy Firebase Components to Production
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            functions:
              - 'firebase/functions/js/**'
              - 'firebase/functions/lib/**'
              - 'firebase/functions/index.js'
              - 'firebase/functions/package.json'
              - 'data_models/lib/**'
              - 'matching/lib/**'
            firestore:
              - 'firebase/firestore/**'

      - name: Install NPM Dependencies
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./firebase/functions/package-lock.json
      - name: npm ci
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Set Up Flutter
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4" # Pin stable toolchain (see client/UPGRADE-README.md)
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-path: "/home/runner/.pub-cache" #hardcoded not ideal, but no way to reference $HOME

      - name: Install Dart Dependencies
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: flutter pub get

      - name: Build Functions
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: dart run build_runner build --output=build

      - name: Deploy Rules and Indexes
        if: steps.changes.outputs.firestore == 'true' || github.event_name == 'workflow_dispatch'
        uses: w9jds/firebase-action@v13.22.1
        with:
          args: deploy --only firestore:rules,firestore:indexes --force
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.APP_PROD_PROJECT_ID }}

      - name: Build Deployment Command
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        id: build-deployment-cmd
        uses: jencompgeek/firebase-function-mapper@main
        with:
          force: true
          mapping-file: ${{ github.workspace }}/.github/workflows/function-mapping.json

      # Must match client dart-define FIREBASE_DATABASE_ID when using a named Firestore DB.
      # Skip entirely when the secret is absent (default DB projects) to avoid
      # the Firebase CLI rejecting an empty config value.
      # Note: secrets context is not valid in if: expressions, so we detect via env in a run step.
      - name: Check FIREBASE_DATABASE_ID presence
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        id: check-db-id
        env:
          DB_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
        run: |
          if [[ -n "$DB_ID" ]]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync Firestore database id for Cloud Functions
        if: (steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch') && steps.check-db-id.outputs.present == 'true'
        uses: w9jds/firebase-action@v13.22.1
        with:
          args: functions:config:set app.firebase_database_id="${{ secrets.FIREBASE_DATABASE_ID }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.APP_PROD_PROJECT_ID }}

      - name: Deploy Functions
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        uses: w9jds/firebase-action@v13.22.1
        with:
          args: functions:config:set "${{ secrets.FIREBASE_CONFIG }}" ; ${{ steps.build-deployment-cmd.outputs.deploy-command }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.APP_PROD_PROJECT_ID }}
